<style>
  :root {
    --cream: #edf5fc;
    --card: #ffffff;
    --green: #e33535;
    --green-dark: #b71c2a;
    --ink: #172a46;
    --muted: #50647e;
    --line: #b9cbe0;
    font-family: Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body { background: var(--cream); color: var(--ink); }
  button, input, select { font: inherit; }
  .login-screen { min-height: 100%; display: grid; place-items: center; padding: 28px 18px; background: radial-gradient(circle at 50% 5%, #ffffff 0, #edf5fc 48%, #d7e8f7 100%); }
  .login-card { width: min(520px, 100%); padding: 42px 46px 38px; border: 2px solid #c8d8e9; border-radius: 28px; background: var(--card); box-shadow: 0 20px 60px rgba(23, 42, 70, .16); }
  .mascot { position: relative; width: 76px; height: 76px; margin: 0 auto 12px; overflow: hidden; border: 5px solid #172a46; border-radius: 50%; background: linear-gradient(#e33535 0 44%, #172a46 44% 56%, #fff 56%); box-shadow: 0 7px 0 rgba(23,42,70,.16); }
  .mascot span { position: absolute; left: 50%; top: 50%; width: 25px; height: 25px; transform: translate(-50%,-50%); border: 5px solid #172a46; border-radius: 50%; background: #fff; }
  .eyebrow { margin: 0; text-align: center; color: #2a75bb; font-weight: 900; font-size: 13px; letter-spacing: .12em; }
  h1 { margin: 8px 0; text-align: center; font-size: clamp(32px, 6vw, 44px); line-height: 1.05; }
  .intro { margin: 0 0 28px; text-align: center; color: var(--muted); font-size: 17px; }
  label { display: block; margin: 18px 0 8px; font-weight: 750; }
  select, input { width: 100%; min-height: 58px; border: 2px solid var(--line); border-radius: 15px; background: white; padding: 0 17px; color: var(--ink); font-size: 18px; outline: none; transition: border .15s, box-shadow .15s; }
  input { text-align: center; font-size: 28px; letter-spacing: .35em; padding-left: calc(17px + .35em); }
  select:focus, input:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(87, 173, 98, .13); }
  .helper { margin: 9px 4px 0; color: var(--muted); font-size: 14px; }
  #btn-login, #btn-class { width: 100%; min-height: 58px; margin-top: 22px; border: 0; border-radius: 16px; background: var(--green); color: white; font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: 0 7px 0 var(--green-dark); }
  #btn-login:active, #btn-class:active { transform: translateY(3px); box-shadow: 0 4px 0 var(--green-dark); }
  #btn-login:disabled, #btn-class:disabled { opacity: .55; cursor: wait; }
  .message { min-height: 22px; margin: 20px 0 0; text-align: center; color: var(--muted); }
  .message.error { color: #b33b32; }
  .app-screen { width: 100%; height: 100%; background: var(--cream); }
  .app-toolbar { height: 44px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 14px; color: #dce8f5; background: #172a46; border-bottom: 3px solid #ffcb05; font-size: 14px; }
  .app-toolbar #student-name { color: white; }
  .app-toolbar #btn-logout { border-color: #7892b0; background: #fff; }
  #student-name { color: var(--ink); font-weight: 750; }
  #save-status { min-width: 54px; text-align: right; }
  #btn-logout { border: 1px solid var(--line); border-radius: 999px; background: white; padding: 6px 12px; color: var(--ink); cursor: pointer; }
  #typer-frame { display: block; width: 100%; height: calc(100% - 44px); border: 0; background: var(--cream); }
  [hidden] { display: none !important; }
  @media (max-width: 560px) {
    .login-card { padding: 30px 22px 28px; border-radius: 22px; }
    .app-toolbar { height: 40px; }
    #typer-frame { height: calc(100% - 40px); }
  }
</style>
